<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCP Registration Form</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        background: linear-gradient(135deg, #e0e5ec, #f5f7fa);
        font-family: Arial, Helvetica, sans-serif;
        padding: 30px 0;
        margin: 0;
    }

    .container {
        max-width: 700px;
        margin: 0 auto;
        background: #f4f4f4;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        overflow: hidden; 
    }
    .header-banner {
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: white;
        padding: 25px 20px;
        text-align: center;
    }
    .logo-circle {
        width: 70px;
        height: 70px;
        background: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 12px auto;
        font-weight: bold;
        font-size: 20px;
        color: #1e3c72;
        letter-spacing: 1px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .logo-img {
        width: 70px;
        height: 70px;
        object-fit: contain;
        border-radius: 50%;
        background: white;
        padding: 6px;
        margin-bottom: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .header-banner h1 {
        margin: 0;
        font-size: 24px;
    }

    .header-banner p {
        margin: 5px 0 0;
        opacity: 0.85;
        font-size: 14px;
    }

    /* ===== FORM BODY ===== */
    .container form {
        padding: 20px 25px;
    }

    .section-card {
        background: white;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        border-left: 4px solid #2a5298;
    }

    .section-card h2 {
        color: #1e3c72;
        margin-top: 0;
        font-size: 19px;
    }

    label {
        display: block;
        margin-top: 10px;
        font-size: 15px;
    }

    .required {
        color: #d9534f;
        font-weight: bold;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="tel"],
    textarea,
    select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin: 8px 0;
        font-size: 15px;
        transition: 0.3s ease;
    }

    input:focus,
    textarea:focus,
    select:focus {
        outline: none;
        border-color: #2a5298;
        box-shadow: 0 0 5px rgba(42, 82, 152, 0.5);
    }

    fieldset {
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 15px;
        background: #f9f9f9;
        margin: 10px 0;
    }

    legend {
        font-weight: bold;
        color: #1e3c72;
        padding: 0 8px;
    }

    input[type="radio"] {
        width: 18px;
        height: 18px;
        accent-color: #2a5298;
        margin-right: 5px;
        cursor: pointer;
        vertical-align: middle;
    }

    h4 {
        color: #d9534f;
        margin-bottom: 6px;
    }

    .note {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 10px;
        background: #fff9e6;
        font-size: 14px;
    }

    input[type="submit"] {
        background: linear-gradient(135deg, #2a5298, #1e3c72);
        color: white;
        border: none;
        border-radius: 6px;
        padding: 14px 30px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    input[type="submit"]:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(42, 82, 152, 0.4);
    }

    input[type="submit"]:active {
        transform: translateY(0);
    }

    .selected-degree {
        margin-top: 8px;
        font-size: 14px;
        color: #1e3c72;
        font-weight: bold;
        min-height: 18px; 
    }
</style>
</head>
<body>

<div class="container">

    <!-- HEADER + LOGO -->
    <div class="header-banner">
       
        <div class="logo-circle">UCP</div>
             <img src="ucp-logo.png" alt="UCP Logo" class="logo-img"> 

        <h1>UCP Registration Form</h1>
        <p>Bachelor Programs Admission 2026</p>
    </div>

    <form action="" method="post">

        <div class="section-card">
            <h2>👤 Personal Information</h2>

            <label for="fullname">Name: <span class="required">*</span></label>
            <input type="text" name="fullname" id="fullname" required>

            <fieldset>
                <legend>Gender</legend>
                <label for="gender-male" style="display:inline;">
                    <input type="radio" name="gender" required id="gender-male"> Male
                </label>
                &nbsp;&nbsp;
                <label for="gender-female" style="display:inline;">
                    <input type="radio" name="gender" required id="gender-female"> Female
                </label>
            </fieldset>

            <label for="marks">Intermediate Marks: <span class="required">*</span></label>
            <input type="number" name="marks" id="marks" required>

            <label for="pin">Previous Institute Name:</label>
            <input type="text" name="pin" id="pin">
        </div>

        <div class="section-card">
            <h2>📞 Contact Information</h2>

            <label for="address">Address: <span class="required">*</span></label>
            <textarea name="address" id="address" rows="4" required></textarea>

            <label for="email">Email: <span class="required">*</span></label>
            <input type="email" name="email" id="email" required>

            <label for="zip">Zip Code:</label>
            <input type="text" name="zip" id="zip">

            <label for="number">Contact Number: <span class="required">*</span></label>
            <input type="tel" name="number" id="number" required>
        </div>

        <div class="section-card">
            <h2>🎓 Choose Degree Program</h2>

            <label for="domain">Degree Domain:</label>
            <select name="domain" id="domain" onchange="showSelectedDegree()">
                <option value="">--Select Degree</option>
                <option value="BS IT">Information Technology</option>
                <option value="Humanities">BS Social Sciences</option>
                <option value="Pharmacology">BS Pharmacology</option>
                <option value="Microbiology">BS Microbiology</option>
                <option value="Chemistry">BS Chemistry</option>
                <option value="Political Sciences">BS Political Science</option>
                <option value="Law">LAW</option>
                <option value="BBA">Business Management</option>
            </select>
            <p id="selectedDegreeText" class="selected-degree"></p>
        </div>

        <h4>Note:</h4>
        <p class="note">Soon you will receive an email (on your provided email address) regarding the Admission Test.</p>

        <input type="submit" value="Submit">

    </form>
</div>

<script>
    function showSelectedDegree() {
       
        const select = document.getElementById("domain");
        const displayText = document.getElementById("selectedDegreeText");

        const selectedLabel = select.options[select.selectedIndex].text;

        if (select.value === "") {
            displayText.textContent = "";
        } else {
            displayText.textContent = "✅ Selected Program: " + selectedLabel;
        }
    }
</script>

</body>
</html>
